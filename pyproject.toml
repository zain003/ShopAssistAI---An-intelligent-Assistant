[project]
name = "shopassist-ai"
version = "1.0.0"
description = "ShopAssist AI — Intelligent E-Commerce Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "httpx>=0.27.0",
]

[tool.vercel]
entrypoint = "backend.api:app"
